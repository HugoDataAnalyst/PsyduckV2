services:
  psyduckv2_app:
    container_name: psyduckv2_app
    build: .
    restart: always
    depends_on:
      psyduckv2_db:
        condition: service_healthy
      psyduckv2_redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: psyduckv2_db
      REDIS_HOST: psyduckv2_redis
      REDIS_PORT: 6379
    #ports:
    #  - "${WEB_PORT}:${WEB_PORT}"
    volumes:
      - ./data:/app/data

  psyduckv2_dashboard:
    container_name: psyduckv2_dashboard
    build: .
    restart: always
    depends_on:
      - psyduckv2_app
    env_file:
      - .env
    environment:
      DB_HOST: psyduckv2_db
      REDIS_HOST: psyduckv2_redis
      REDIS_PORT: 6379
    command: python run_dashboard.py
    #ports:
    #  - "8050:8050"
    volumes:
      - ./data:/app/data
      - ./dashboard/data:/app/dashboard/data

  psyduckv2_db:
    container_name: psyduckv2_db
    image: mariadb:10.11
    restart: always
    env_file:
      - .env
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
    # Tuning for a host dedicated to PsyduckV2 - scale the buffer pool to ~50-70%
    # of the RAM you give MariaDB. max_allowed_packet must fit the Redis backup's
    # batched rows; flush_log_at_trx_commit=2 trades up to ~1s of commits on an
    # OS crash for much faster bulk inserts (MariaDB crashes alone lose nothing).
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --skip-log-bin
      --innodb-buffer-pool-size=4G
      --innodb-log-file-size=1G
      --innodb-log-buffer-size=128M
      --innodb-flush-log-at-trx-commit=2
      --innodb-io-capacity=2000
      --innodb-io-capacity-max=4000
      --max-allowed-packet=128M
      --tmp-table-size=256M
      --max-heap-table-size=256M
      --max-connections=1000
      --table-open-cache=8000
      --open-files-limit=65535
      --slow-query-log=1
      --long-query-time=2
    # Ports should be commented out in production.
    ports:
      - "3307:3306"
    volumes:
      - ./database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "-h", "127.0.0.1", "-u", "${DB_USER}", "-p${DB_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 180s

  psyduckv2_pma:
    container_name: psyduckv2_pma
    image: phpmyadmin/phpmyadmin
    restart: always
    env_file:
      - .env
    environment:
      PMA_HOST: psyduckv2_db
      PMA_PORT: 3306
      #PMA_PORT: ${DB_PORT}
      # PMA_USER: ${DB_USER} # Force PMA to ask for user and password
      # PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - 3306:80
    # Only expose if PMA_WEB_PORT is set
    #  - "${PMA_WEB_PORT}:80"
    depends_on:
      psyduckv2_db:
        condition: service_healthy  # Depends on the database being healthy

  psyduckv2_redis:
    container_name: psyduckv2_redis
    # Plain Redis: PsyduckV2 only uses hashes, lists and sorted sets - no modules.
    image: redis:7.4.2
    restart: always
    env_file:
      - .env
    # Ports should be commented out in production (the app reaches Redis on the
    # compose network).
    ports:
      - 6379:6379
    volumes:
      - ./redis-data:/data # Persistent storage
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      #REDIS_ARGS: "--requirepass ${REDIS_PASSWORD} --appendonly yes --save 60 1"
      #REDISTIMESERIES_ARGS: "RETENTION_POLICY=315360000000"  # Keep data for 10 years
    # ── Redis persistence mode ─────────────────────────────────────────────────
    # DEFAULT (persistence enabled, REDIS_MYSQL_BACKUPS = false):
    #   AOF + RDB keep data on disk across restarts. Use the command block below.
    #
    # IN-MEMORY MODE (REDIS_MYSQL_BACKUPS = true in config.json):
    #   The app keeps its data in MySQL instead and restores it after a Redis
    #   restart. It never changes Redis' own config, so turn persistence off
    #   here by replacing the command block below with:
    #
    #   command: >
    #     redis-server
    #     --requirepass ${REDIS_PASSWORD}
    #     --appendonly no
    #     --save ""
    #     --hash-max-listpack-entries 4096
    #     --tcp-backlog 65536
    #     --tcp-keepalive 0
    #
    # hash-max-listpack-entries 4096: the daily/weekly Pokémon counter hashes
    # hold ~800-2,600 fields; above the default 512 Redis stores them ~3.5x
    # larger. (Existing keys: see my_redis/utils/reencode_hashes.py.)
    # ──────────────────────────────────────────────────────────────────────────
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --tcp-backlog 65536
      --tcp-keepalive 0
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 512mb
      --save 900 1
      --save 300 10
      --save 60 10000
      --hash-max-listpack-entries 4096
    healthcheck:
      # Authenticated: without the password `redis-cli ping` gets NOAUTH yet
      # still exits 0, so the check could never fail.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  default:
    external:
      name: psyduckv2_network
